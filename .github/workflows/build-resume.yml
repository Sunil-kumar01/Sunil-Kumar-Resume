name: Build downloadable resume

on:
  push:
    branches: [main]
    paths:
      - 'resume_content.json'
      - 'resume_content_ai_engineer.json'
      - 'generate_resume.py'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document generators
        run: python -m pip install python-docx reportlab
      - name: Generate original and Senior Digital Engineer resumes
        run: |
          python generate_resume.py
          python generate_resume.py --data resume_content_ai_engineer.json --prefix Sunil_Kumar_Senior_Digital_AI_Engineer
      - name: Publish files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sunil_Kumar_Resume.pdf Sunil_Kumar_Resume.docx Sunil_Kumar_Senior_Digital_AI_Engineer.pdf Sunil_Kumar_Senior_Digital_AI_Engineer.docx
          if git diff --cached --quiet; then
            echo "Resume files are already current."
          else
            git commit -m "Build original and targeted resume files"
            git push origin main
          fi
